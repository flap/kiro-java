# Profile de producao: ativado com SPRING_PROFILES_ACTIVE=prod
# Todos os segredos vem de variaveis de ambiente — NUNCA commite credenciais.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  shutdown: graceful

logging:
  level:
    root: WARN
    dev.kiro.community: INFO
