# Configuração do ScanAPI (opcional).
# Docs: https://scanapi.dev
# Permite rodar simplesmente `scanapi run` dentro de api-tests/.
spec_path: scanapi.yaml
output_path: scanapi-report.html

# Variáveis de ambiente usadas pelo spec. Podem ser sobrescritas pelo ambiente
# real (ex.: em CI, exporte BASE_URL antes de rodar).
env_vars:
  BASE_URL: http://localhost:8080
